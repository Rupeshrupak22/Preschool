services:
  - type: web
    name: preschool-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
